name: UI checks

on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/ui-check.py', 'scripts/requirements-ui.txt', '.github/workflows/ui.yml']
  pull_request:
    paths: ['public/**', 'scripts/ui-check.py', 'scripts/requirements-ui.txt', '.github/workflows/ui.yml']

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui-check.py --output ui-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-checks-and-screenshots
          path: ui-artifacts/
          retention-days: 14
