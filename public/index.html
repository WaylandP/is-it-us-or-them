<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is it us or them?</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f9d55'/%3E%3C/svg%3E" id="favicon">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="/" id="brand">Is it us or them?</a>
      <nav>
        <a href="/api/status.txt" title="Plain-text summary for pasting into chat">Text version</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>

    <main>
      <section class="verdict level-unknown" id="verdict" aria-live="polite">
        <div class="dot">…</div>
        <div>
          <h1>Loading…</h1>
          <p class="detail muted">Fetching the latest status.</p>
        </div>
        <div class="meta"></div>
      </section>

      <section id="services-section">
        <h2>Services <span class="count" id="services-count"></span></h2>
        <div id="services"></div>
      </section>

      <section id="incidents-section">
        <h2>Active incidents <span class="count" id="incidents-count"></span></h2>
        <div class="list" id="incidents"></div>
      </section>

      <section id="maintenance-section">
        <h2>Maintenance <span class="count" id="maintenance-count"></span></h2>
        <div class="list" id="maintenance"></div>
      </section>

      <section id="posts-section">
        <h2 id="posts-title">From IT</h2>
        <div class="list" id="posts"></div>
      </section>
    </main>

    <footer class="site">
      <span id="footer-note"></span>
      <a href="/api/status">JSON</a>
      <a href="/api/status.txt">Text</a>
      <a href="https://github.com/WaylandP/is-it-us-or-them" target="_blank" rel="noopener">Source</a>
    </footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
