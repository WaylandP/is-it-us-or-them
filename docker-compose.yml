services:
  status:
    build: .
    image: is-it-us-or-them
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a unique ADMIN_TOKEN in .env}
      SITE_NAME: ${SITE_NAME:-Is it us or them?}
      ORG_NAME: ${ORG_NAME:-IT}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-10000}
      STATUS_STALE_AFTER_SECONDS: ${STATUS_STALE_AFTER_SECONDS:-}
      CHECK_ALLOWED_TARGETS: ${CHECK_ALLOWED_TARGETS:-}
      SEED_SERVICES: ${SEED_SERVICES:-true}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    volumes:
      - status-data:/data

volumes:
  status-data:
